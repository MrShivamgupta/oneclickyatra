<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <a class="brand" routerLink="/">
      <span class="brand-icon">✈</span>
      <div>
        <div class="brand-title">One Click Yatra</div>
        <div class="brand-subtitle">Reset your password</div>
      </div>
    </a>

    <h1>Reset password</h1>

    <p class="info-message">
      Enter the reset token from your email along with your new password. Don't have a token yet?
      <a routerLink="/forgot-password">Request one</a>.
    </p>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label>
      Reset token
      <input type="text" formControlName="resetToken" autocomplete="one-time-code" />
      @if (form.controls.resetToken.invalid && form.controls.resetToken.touched) {
        <span class="field-error">Reset token is required.</span>
      }
    </label>

    <label>
      New password
      <input type="password" formControlName="newPassword" autocomplete="new-password" />
      <span class="field-hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a digit.</span>
      @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
        <span class="field-error">Password does not meet the requirements above.</span>
      }
    </label>

    @if (errorMessage()) {
      <div class="form-error" role="alert">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Resetting…' : 'Reset password' }}
    </button>

    <div class="form-footer">
      <a routerLink="/login">Back to sign in</a>
    </div>
  </form>
</div>
