<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <a class="brand" routerLink="/">
      <span class="brand-icon">✈</span>
      <div>
        <div class="brand-title">One Click Yatra</div>
        <div class="brand-subtitle">Create account</div>
      </div>
    </a>

    <h1>Sign up</h1>

    <label>
      Full name
      <input type="text" formControlName="fullName" autocomplete="name" />
      @if (form.controls.fullName.invalid && form.controls.fullName.touched) {
        <span class="field-error">Full name is required.</span>
      }
    </label>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label>
      Phone
      <input type="tel" formControlName="phone" autocomplete="tel" />
      @if (form.controls.phone.invalid && form.controls.phone.touched) {
        <span class="field-error">Enter a valid phone number (7-15 digits, optional leading +).</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="new-password" />
      <span class="field-hint">At least 8 characters, with an uppercase letter, a lowercase letter, and a digit.</span>
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Password does not meet the requirements above.</span>
      }
    </label>

    @if (errorMessage()) {
      <div class="form-error" role="alert">
        {{ errorMessage() }}
        @if (fieldErrors().length) {
          <ul>
            @for (message of fieldErrors(); track message) {
              <li>{{ message }}</li>
            }
          </ul>
        }
      </div>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Creating account…' : 'Create account' }}
    </button>

    <div class="form-footer">
      Already have an account? <a routerLink="/login">Sign in</a>
    </div>
  </form>
</div>
