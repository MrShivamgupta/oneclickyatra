<div class="login-page">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-icon">✈</span>
      <div>
        <div class="brand-title">One Click Yatra</div>
        <div class="brand-subtitle">CRM</div>
      </div>
    </div>

    <h1>Sign in</h1>

    <label>
      Email
      <input type="email" formControlName="email" autocomplete="username" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">Enter a valid email address.</span>
      }
    </label>

    <label>
      Password
      <input type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">Password is required.</span>
      }
    </label>

    @if (successMessage()) {
      <div class="form-success" role="status">{{ successMessage() }}</div>
    }

    @if (errorMessage()) {
      <div class="form-error" role="alert">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>

    <div class="auth-links">
      <a routerLink="/forgot-password">Forgot password?</a>
      <a routerLink="/register">Create an account</a>
    </div>
  </form>
</div>
