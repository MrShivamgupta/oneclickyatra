<div class="page-header">
  <div>
    <h1>Invoices</h1>
    <p class="subtitle">Generated automatically once a booking is paid in full.</p>
  </div>
</div>

<app-filter-bar placeholder="Search by invoice #, booking # or customer…" (searchChange)="onSearchChange($event)" />

<app-data-table [columns]="columns" [rows]="invoices()" [loading]="loading()" emptyMessage="No invoices yet.">
  <ng-template #rowTemplate let-invoice>
    <tr>
      <td>{{ invoice.invoiceNumber }}</td>
      <td>{{ invoice.bookingNumber }}</td>
      <td>{{ invoice.customerName ?? '—' }}</td>
      <td>Rs. {{ invoice.amount | number: '1.0-0' }}</td>
      <td>{{ invoice.issuedAt | date: 'dd MMM yyyy' }}</td>
      <td class="actions-cell">
        <button type="button" class="link-button" [disabled]="downloadingId() === invoice.id" (click)="downloadPdf(invoice)">
          {{ downloadingId() === invoice.id ? 'Preparing…' : 'Download PDF' }}
        </button>
      </td>
    </tr>
  </ng-template>
</app-data-table>

<app-pagination [pageNumber]="pageNumber()" [pageSize]="10" [totalCount]="totalCount()" (pageChange)="onPageChange($event)" />
