<form class="inline-form" [formGroup]="form" (ngSubmit)="save()">
  <label class="field">
    Name
    <input type="text" formControlName="name" placeholder="e.g. Honeymoon" />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <span class="field-error">Name is required.</span>
    }
  </label>
  <label class="field">
    Slug
    <input type="text" formControlName="slug" placeholder="e.g. honeymoon" />
    @if (form.controls.slug.invalid && form.controls.slug.touched) {
      <span class="field-error">Enter a valid slug (lowercase, hyphen-separated, e.g. honeymoon).</span>
    }
  </label>
  <label class="field">
    Description
    <input type="text" formControlName="description" placeholder="Optional" />
  </label>
  <div class="form-actions">
    <button type="submit" class="primary-button" [disabled]="isSaving()">
      {{ isSaving() ? 'Saving…' : (editingId() ? 'Update Category' : 'Add Category') }}
    </button>
    @if (editingId()) {
      <button type="button" class="secondary-button" (click)="cancelEdit()">Cancel</button>
    }
  </div>
  @if (formError()) {
    <div class="form-error">
      {{ formError() }}
      @if (formFieldErrors().length) {
        <ul>
          @for (message of formFieldErrors(); track message) {
            <li>{{ message }}</li>
          }
        </ul>
      }
    </div>
  }
</form>

@if (loadError()) {
  <p class="form-error">{{ loadError() }}</p>
}

<app-data-table [columns]="columns" [rows]="categories()" [loading]="loading()" emptyMessage="No categories yet.">
  <ng-template #rowTemplate let-category>
    <tr>
      <td>{{ category.name }}</td>
      <td>{{ category.slug }}</td>
      <td>{{ category.description ?? '—' }}</td>
      <td class="actions-cell">
        <button type="button" class="link-button" (click)="edit(category)">Edit</button>
        <button type="button" class="link-button danger" (click)="confirmDelete(category)">Delete</button>
      </td>
    </tr>
  </ng-template>
</app-data-table>

<app-confirmation-dialog
  [open]="deleteTarget() !== null"
  title="Delete category?"
  [message]="'This will remove \'' + (deleteTarget()?.name ?? '') + '\'.'"
  confirmLabel="Delete"
  [confirming]="deleting()"
  confirmingLabel="Deleting…"
  [errorMessage]="deleteError()"
  (confirmed)="performDelete()"
  (cancelled)="cancelDelete()"
/>
