<form class="inline-form" [formGroup]="form" (ngSubmit)="save()">
  <label class="field">
    Name
    <input type="text" formControlName="name" placeholder="e.g. India" />
    @if (form.controls.name.invalid && form.controls.name.touched) {
      <span class="field-error">Name is required.</span>
    }
  </label>
  <label class="field">
    ISO Code
    <input type="text" formControlName="isoCode" placeholder="e.g. IN" maxlength="3" />
    @if (form.controls.isoCode.invalid && form.controls.isoCode.touched) {
      <span class="field-error">Enter a valid ISO code (2-3 letters).</span>
    }
  </label>
  <div class="form-actions">
    <button type="submit" class="primary-button" [disabled]="isSaving()">
      {{ isSaving() ? 'Saving…' : (editingId() ? 'Update Country' : 'Add Country') }}
    </button>
    @if (editingId()) {
      <button type="button" class="secondary-button" (click)="cancelEdit()">Cancel</button>
    }
  </div>
  @if (formError()) {
    <div class="form-error">
      {{ formError() }}
      @if (formFieldErrors().length) {
        <ul>
          @for (message of formFieldErrors(); track message) {
            <li>{{ message }}</li>
          }
        </ul>
      }
    </div>
  }
</form>

@if (loadError()) {
  <p class="form-error">{{ loadError() }}</p>
}

<app-data-table [columns]="columns" [rows]="countries()" [loading]="loading()" emptyMessage="No countries yet.">
  <ng-template #rowTemplate let-country>
    <tr>
      <td>{{ country.name }}</td>
      <td>{{ country.isoCode }}</td>
      <td class="actions-cell">
        <button type="button" class="link-button" (click)="edit(country)">Edit</button>
        <button type="button" class="link-button danger" (click)="confirmDelete(country)">Delete</button>
      </td>
    </tr>
  </ng-template>
</app-data-table>

<app-confirmation-dialog
  [open]="deleteTarget() !== null"
  title="Delete country?"
  [message]="'This will remove \'' + (deleteTarget()?.name ?? '') + '\'. Cities and destinations linked to it may be affected.'"
  confirmLabel="Delete"
  [confirming]="deleting()"
  confirmingLabel="Deleting…"
  [errorMessage]="deleteError()"
  (confirmed)="performDelete()"
  (cancelled)="cancelDelete()"
/>
